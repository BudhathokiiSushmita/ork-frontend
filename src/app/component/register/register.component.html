<!-- Jumbotron -->
<div class="px-4 py-5 px-md-5 text-center text-lg-start ork-bg">
  <div class="container">
    <div class="row gx-lg-5 align-items-center">
      <div class="col-lg-12 mb-5 mb-lg-0">
        <div class="card">
          <div class="card-body py-5 px-md-5">
            <h1>{{'Register @ORK'}}</h1>
            <form (ngSubmit)="submitForm()" [formGroup]="form">
<!--              <div class="row">-->
<!--                <div class="col-md-6 mb-4">-->
<!--                  <ngx-select-->
<!--                    [formControl]="selectControl"-->
<!--                    [allowClear]="true"-->
<!--                    [items]="roles"-->
<!--                    optionValueField="roleName"-->
<!--                    optionTextField="roleName"-->
<!--                    id="role"-->
<!--                    placeholder="Select Your Role">-->
<!--                  </ngx-select>-->
<!--                </div>-->
<!--              </div>-->

              <div class="row">
                <div class="col-md-6">
                  <div class="form-outline mb-4">
                    <input type="username" id="username" class="form-control" formControlName="username"/>
                    <label class="form-label" for="username">Username</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-outline mb-4">
                    <input type="password" id="password" class="form-control" formControlName="password" />
                    <label class="form-label" for="password">Password</label>
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6">
                  <div class="form-outline mb-4">
                    <input type="email" id="email" class="form-control" formControlName="email"/>
                    <label class="form-label" for="email">Email</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-outline mb-4">
                    <input type="text" id="contactNumber" class="form-control" formControlName="contactNumber" />
                    <label class="form-label" for="contactNumber">Contact Number</label>
                  </div>
                </div>
              </div>

              <button type="submit" class="btn btn-outline-primary btn-block mb-4 float-end">
                Sign up
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
