<div class="row d-flex justify-content-center">
  <div class="col-11">

    <!-- Table when data exists -->
    <div class="mat-elevation-z8" *ngIf="dataList.length > 0; else noData">
      <table mat-table [dataSource]="dataSource">

        <!-- SN Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> SN </th>
          <td mat-cell *matCellDef="let element; let i = index">
            {{ i + 1 }}
          </td>
        </ng-container>

        <!-- Username Column -->
        <ng-container matColumnDef="username">
          <th mat-header-cell *matHeaderCellDef> Username </th>
          <td mat-cell *matCellDef="let element">
            {{ element.username }}
          </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="emailAddress">
          <th mat-header-cell *matHeaderCellDef> Email </th>
          <td mat-cell *matCellDef="let element">
            {{ element.emailAddress }}
          </td>
        </ng-container>

        <!-- Phone Column -->
        <ng-container matColumnDef="contactNumber">
          <th mat-header-cell *matHeaderCellDef> Phone Number </th>
          <td mat-cell *matCellDef="let element">
            {{ element.contactNumber }}
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>

      <mat-paginator
        [pageSizeOptions]="[5, 10, 20]"
        showFirstLastButtons
        aria-label="Select pages">
      </mat-paginator>
    </div>

    <!-- Empty state -->
    <ng-template #noData>
      <app-no-data
        title="No Applicants Yet"
        message="There are currently no applicants to display. New applicants will appear here once they apply."
        icon="people_outline">
      </app-no-data>
    </ng-template>
  </div>
</div>
