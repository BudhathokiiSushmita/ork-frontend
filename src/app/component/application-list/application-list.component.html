<div class="row d-flex justify-content-center mt-2">
  <div class="col-11">

    <!--bread crumbs-->
    <div class="row d-flex justify-content-center p-3">
      <div class="col-12">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="#">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page"> Applications</li>
          </ol>
        </nav>
      </div>
    </div>


    <div class="mat-elevation-z8">
      <table mat-table [dataSource]="dataSource">

        <!-- SN Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> SN </th>
          <td mat-cell *matCellDef="let element; let i = index"> {{ i + 1 }} </td>
        </ng-container>

        <ng-container matColumnDef="vacancy">
          <th mat-header-cell *matHeaderCellDef> Vacancy </th>
          <td mat-cell *matCellDef="let element"> {{ element.vacancy.title }} </td>
        </ng-container>

        <ng-container matColumnDef="submittedDate">
          <th mat-header-cell *matHeaderCellDef> Applied On </th>
          <td mat-cell *matCellDef="let element"> {{ element.submittedDate | date }} </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> Status </th>
          <td mat-cell *matCellDef="let element"> {{ element.recentStage.stageStatus }} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                     showFirstLastButtons
                     aria-label="Select pages">
      </mat-paginator>
    </div>
  </div>
</div>
